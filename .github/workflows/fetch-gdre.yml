name: Fetch Godot 4.7.2 Linux

on:
  push:
    branches:
      - feature/intuitive-building-planets
    paths:
      - '.github/workflows/fetch-gdre.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          curl -fL --retry 3 -o godot.zip "$url"
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
      - name: Upload Godot
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux
          path: godot.zip
          compression-level: 0
          retention-days: 1
