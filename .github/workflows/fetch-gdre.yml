name: Fetch Android Build Tools

on:
  push:
    branches:
      - feature/intuitive-building-planets
    paths:
      - '.github/workflows/fetch-gdre.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Package Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$TOOLS_DIR/apksigner"
          test -x "$TOOLS_DIR/zipalign"
          echo "Using $TOOLS_DIR"
          tar -C "$(dirname "$TOOLS_DIR")" -czf android-build-tools.tgz "$(basename "$TOOLS_DIR")"
      - name: Upload Android tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools
          path: android-build-tools.tgz
          compression-level: 0
          retention-days: 1
